<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuxTranslator PDF</title>
  <link rel="stylesheet" href="viewer.css">
  <!-- Shared content.css so our PDF overlay styles apply in the viewer too. -->
  <link rel="stylesheet" href="../content/content.css">
</head>
<body>
  <header id="muxt-viewer-toolbar">
    <!-- Left: app name + loaded document title -->
    <span id="muxt-app-name">MuxTranslator PDF</span>
    <span id="muxt-doc-title"></span>

    <span class="spacer"></span>

    <!-- Right group: status · dev controls (hidden) · dev toggle · open PDF -->
    <span id="muxt-status"></span>

    <div id="muxt-dev-controls" hidden>
      <button id="muxt-debug-btn" class="toolbar-btn toolbar-btn-ghost" type="button">
        🔍 段落区域
      </button>
      <button id="muxt-chars-btn" class="toolbar-btn toolbar-btn-ghost" type="button">
        📏 文本块
      </button>
    </div>

    <button id="muxt-translate-btn" class="toolbar-btn toolbar-btn-ghost" type="button" disabled>
      🌐 <span data-i18n="btnTranslate">翻译</span>
    </button>
    <label for="muxt-file-input" class="toolbar-btn" id="muxt-open-btn">
      📂 <span data-i18n="viewerOpen">打开 PDF</span>
    </label>
    <input id="muxt-file-input" type="file" accept="application/pdf,.pdf" hidden>
  </header>

  <main id="muxt-viewer-main">
    <div id="muxt-empty-state">
      <p class="big" data-i18n="viewerEmptyTitle">打开一个 PDF 来翻译</p>
      <p class="muted" data-i18n="viewerEmptyHint">点击右上角"打开 PDF"或将文件拖放到此处。</p>
    </div>
    <div id="viewer" class="pdfViewer"></div>
  </main>

  <!-- Signal to content.js that auto-init should wait for the PDF to load. -->
  <script>window.__muxtViewerManaged = true;</script>

  <!-- Shared libs used by content.js -->
  <script src="../lib/i18n.js"></script>
  <script src="../lib/utils.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="../content/pdf.js"></script>
  <script src="../content/ui.js"></script>
  <script src="../content/scanner.js"></script>
  <script src="../content/pump.js"></script>
  <script src="../content/selection.js"></script>
  <script src="../content/content.js"></script>

  <!-- Viewer logic (ES module so we can import pdf.mjs directly) -->
  <script type="module" src="viewer.js"></script>
</body>
</html>
