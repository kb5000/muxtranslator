<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MuxTranslator PDF</title>
  <link rel="stylesheet" href="viewer.css">
  <!-- Shared content.css so our PDF overlay styles apply in the viewer too. -->
  <link rel="stylesheet" href="../content/content.css">
</head>
<body>
  <header id="muxt-viewer-toolbar">
    <label for="muxt-file-input" class="toolbar-btn" id="muxt-open-btn">
      <span data-i18n="viewerOpen">Open PDF</span>
    </label>
    <input id="muxt-file-input" type="file" accept="application/pdf,.pdf" hidden>
    <span id="muxt-doc-title"></span>
    <span class="spacer"></span>
    <span id="muxt-status"></span>
  </header>

  <main id="muxt-viewer-main">
    <div id="muxt-empty-state">
      <p class="big" data-i18n="viewerEmptyTitle">Open a PDF to translate</p>
      <p class="muted" data-i18n="viewerEmptyHint">Click "Open PDF" above or drop a file anywhere on this page.</p>
    </div>
    <div id="viewer" class="pdfViewer"></div>
  </main>

  <!-- Signal to content.js that auto-init should wait for the PDF to load
       (viewer.js dispatches 'muxt-pdf-loaded' on window once ready). -->
  <script>window.__muxtViewerManaged = true;</script>

  <!-- Shared libs used by content.js -->
  <script src="../lib/utils.js"></script>
  <script src="../lib/settings.js"></script>
  <script src="../content/pdf.js"></script>
  <script src="../content/content.js"></script>

  <!-- Viewer logic (ES module so we can import pdf.mjs directly) -->
  <script type="module" src="viewer.js"></script>
</body>
</html>
