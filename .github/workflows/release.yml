name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: extractions/setup-just@v2

      - name: Build extensions
        run: just --shell bash --shell-arg -c build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/muxtranslator-firefox-v*.zip
            dist/muxtranslator-chrome-v*.zip
          generate_release_notes: true
